<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            margin:0;
            background:white;
            font-family:Arial;
        }

        .header{
            background:#195774;
            color:white;
            text-align:center;
            padding:18px;
            font-size:40px;
            font-weight:bold;
        }

        .banner img{
            width:100%;
            
            
        }

        .puppy-section{
            width:90%;
            margin:20px auto;
            display:flex;
            justify-content:space-between;
            gap:20px;
        }

        .puppy-section img{
            width:100%;
        }

        .puppy-box{
            width:30%;
        }

        .missing{
            width:30%;
            background:#EE4D65;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            font-size:32px;
            font-weight:bold;
        }

        .title{
            text-align:center;
            font-size:40px;
            margin:40px 0 10px;
        }

        .more-puppies{
            width:90%;
            margin:20px auto 40px;
            display:flex;
            gap:40px;
        }

        .more-puppies div{
            flex:1;
        }

        .more-puppies img{
            width:100%;
            display:block;
        }

        .footer{
            background:#195774;
            color:white;
            text-align:center;
            padding:22px;
            font-size:28px;
        }

    </style>
</head>

<body>

    <div class="header">
        Puppy Lovers Page
    </div>

    <div class="banner">
        <img src="banner-puppies.jpg" alt="Banner">
    </div>

    <div class="puppy-section">

        <div class="puppy-box">
            <img src="puppy-1.jpg" alt="Puppy 1">
        </div>

        <div class="missing">
            Puppy <br>
            missing <br>
            here!!
        </div>

        <div class="puppy-box">
            <img src="puppy-2.jpg" alt="Puppy 2">
        </div>

    </div>

    <div class="title">
        More Puppies
    </div>

    <div class="more-puppies">

        <div>
            <img src="puppy-3.jpg" alt="Puppy 3">
        </div>

        <div>
            <img src="puppy-4.jpg" alt="Puppy 4">
        </div>

    </div>

    <div class="footer">
        Developed by: Eaba Desta
    </div>

</body>
</html>
